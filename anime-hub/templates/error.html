{% extends "base.html" %}

{% block content %}
    <div class="container">
        <div class="alert alert-danger" role="alert" style="margin-top: 10px;">
            {{ error_msg }}
        </div>
        <a href="/"><button class="btn btn-primary"><i class="fa fa-home"></i> Home</button></a>
        {% if status_code == 500 %}
            <button class="btn btn-primary" onclick="window.location.reload();"><i class="fa fa-repeat" aria-hidden="true"></i> Retry</button>
        {% endif %}
    </div>
{% endblock %}
