<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" integrity="sha512-SfTiTlX6kk+qitfevl/7LibUOeJWlt9rbyDn92a1DqWOw9vWG2MFoays0sgObmWazO5BQPiFucnnEAjpAB+/Sw==" crossorigin="anonymous" />

    <style>
        @font-face {
            font-family: College Semi-condensed;
            src: url("{{ url_for('static', filename='fonts/COLLEGES.TTF') }}");
        }
        a.navbar-brand{
            font-family: College Semi-condensed;
        }
    </style>
    {% block stylesheet %}{% endblock %}

    <title>Anime Hub</title>
</head>
<body class="bg-dark">
    <nav class="navbar navbar-expand-md sticky-top" style="background-color: #1b1b1b;">
        <a class="navbar-brand" href="/">
            <!--<img src="{{ url_for('static', filename='icons/logo.png') }}" height="50" alt="Anime Hub">-->
            ANIME HUB
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbar-items" aria-controls="navbar-items" aria-expanded="false" aria-label="Toggle navigation">
            <i class="fa fa-bars" aria-hidden="true" style="font-size: 28px; color: #87939a;"></i>
        </button>
        <div class="collapse navbar-collapse" id="navbar-items">
            <ul class="nav navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link" href="https://github.com/ibldzn/anime-hub" target="_blank">GitHub <i class="fa fa-github"></i></a></li>
            </ul>
        </div>
    </nav>
    {% block content %}{% endblock %}

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>
    {% block script %}{% endblock %}
</body>
</html>
