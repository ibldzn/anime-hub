{% extends "base.html" %}

{% block stylesheet %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/css/bootstrap-select.min.css" integrity="sha384-2SvkxRa9G/GlZMyFexHk+WN9p0n2T+r38dvBmw5l2/J3gjUcxs9R1GwKs0seeSh3" crossorigin="anonymous">
{% endblock %}

{% block content %}
    <div class="container-fluid">
        <form action="{{ url_for('search') }}" method="get">
            <div class="form-group" style="margin-top: 10px;">
                <input type="text" class="form-control" id="anime" name="anime" required placeholder="Anime title">
                <small id="search-anime-tip" class="form-text text-muted">Search the anime you want to find</small>
            </div>
            <div class="form-group">
                <select name="sources" class="selectpicker" data-width="100%" data-selected-text-format="count" data-live-search="true" data-actions-box="true" multiple>
                    {% for site in sites|sort %}
                        <option value="{{ site }}">{{ site[:site.rfind('.')]|upper }}</option>
                    {% endfor %}
                </select>
                <small id="select-source-tip" class="form-text text-muted">Leave blank to search from all available sources</small>
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
        </form>
    </div>
{% endblock %}

{% block script %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/bootstrap-select.min.js" integrity="sha384-SfMwgGnc3UiUUZF50PsPetXLqH2HSl/FmkMW/Ja3N2WaJ/fHLbCHPUsXzzrM6aet" crossorigin="anonymous"></script>
{% endblock %}
